version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: climaton_backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    networks:
      - climaton-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: climaton_frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://climasim.duckdns.org
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - climaton-network

  reverse-proxy:
    image: caddy:2-alpine
    container_name: climaton_proxy
    restart: unless-stopped
    ports:
      - "80:80"   
      - "443:443" 
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - climaton-network

volumes:
  caddy_data:
  caddy_config:

networks:
  climaton-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16