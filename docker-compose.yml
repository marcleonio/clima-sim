version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: climaton_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    networks:
      - climaton-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: climaton_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - climaton-network

networks:
  climaton-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16