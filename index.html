<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel ClimaSim - VPS</title>
    <style>
        /* Remove margens e preenchimento padrão do navegador */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Evita barras de rolagem duplas */
        }

        /* Estiliza o iframe para ocupar toda a tela */
        .full-screen-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- O iframe carrega o site inteiro da VPS sem interferência visual do GitHub -->
    <iframe 
        src="https://climasim.duckdns.org" 
        class="full-screen-iframe"
        title="ClimaSim Painel VPS">
    </iframe>

    <!-- 
        IMPORTANTE: O código JavaScript de 'fetch' que você tinha antes 
        não é necessário aqui, pois o iframe carrega a página visualmente 
        direto da VPS.
    -->

</body>
</html>
